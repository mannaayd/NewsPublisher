services:
  news-channel-bot:
    image: news-channel:local
    build:
      context: .
    container_name: news-channel-bot
    user: "1000:1000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/news-channel-bot.heartbeat'; assert os.path.exists(p) and time.time()-os.path.getmtime(p)<90"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    env_file:
      - .env
    environment:
      SCRAPIT_BASE_URL: http://scrapit-adapter:7331
      DATABASE_URL: /app/data/news.db
    volumes:
      - ./data:/app/data
    networks:
      - scrapit
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

networks:
  scrapit:
    external: true
    name: scrapit_default
