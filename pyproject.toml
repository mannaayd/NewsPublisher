[project]
name = "news-channel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "aiosqlite>=0.20",
  "feedparser>=6.0",
  "httpx>=0.27",
  "pydantic-settings>=2.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
